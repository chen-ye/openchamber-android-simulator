<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--oc-background, #111214);
        color: var(--oc-foreground, #f4f4f5);
        font-family: var(--oc-font, system-ui, sans-serif);
        overflow: hidden;
      }
      .oc-page-shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }
      .oc-page-bar {
        padding: 8px 12px;
        border-bottom: 1px solid var(--oc-border, rgba(128, 128, 128, 0.25));
        flex: 0 0 auto;
      }
      .oc-bar-wrap {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .oc-bar-row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .oc-slot-device {
        min-width: 180px;
        max-width: 280px;
        flex: 1 1 180px;
      }
      .oc-slot-group {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .oc-slot-badge {
        margin-left: auto;
      }
      .oc-extras-row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        padding-top: 6px;
        border-top: 1px solid var(--oc-border, rgba(128, 128, 128, 0.2));
      }
      .oc-extra-field {
        flex: 1 1 220px;
        min-width: 180px;
      }
      .oc-tiles {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 10px;
        padding: 10px;
        box-sizing: border-box;
      }
      .oc-tile {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        border: 1px solid var(--oc-border, rgba(128, 128, 128, 0.25));
        background: var(--oc-card, rgba(255, 255, 255, 0.03));
        overflow: hidden;
        outline: none;
      }
      .oc-tile.is-focused {
        border-color: var(--oc-primary, #3b82f6);
        box-shadow: 0 0 0 1px var(--oc-primary, #3b82f6);
      }
      .oc-tile-corner {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 4px;
        z-index: 5;
      }
      .oc-tile-title {
        position: absolute;
        top: 10px;
        left: 12px;
        font-size: 12px;
        opacity: 0.78;
        pointer-events: none;
        z-index: 5;
      }
      .oc-mini-btn {
        border: 1px solid var(--oc-border, rgba(128, 128, 128, 0.35));
        background: var(--oc-background, rgba(0, 0, 0, 0.55));
        color: var(--oc-foreground, inherit);
        border-radius: 6px;
        width: 24px;
        height: 24px;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
      }
      .oc-device-stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }
      .oc-bezel {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: padding 120ms ease, border-radius 120ms ease;
      }
      .oc-bezel.is-framed {
        padding: 16px 10px 18px 10px;
        border-radius: 26px;
        background: #1b1c20;
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.08), 0 12px 32px rgba(0, 0, 0, 0.45);
      }
      .oc-bezel.is-framed::before {
        content: '';
        position: absolute;
        top: 7px;
        left: 50%;
        transform: translateX(-50%);
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #0a0a0c;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
      }
      .oc-hw-side {
        position: absolute;
        right: -5px;
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      .oc-bezel.is-framed .oc-hw-side {
        display: flex;
      }
      .oc-hw-key {
        width: 5px;
        border: 0;
        padding: 0;
        border-radius: 2px;
        background: #3f3f46;
        cursor: pointer;
      }
      .oc-hw-key:hover {
        background: var(--oc-primary, #60a5fa);
      }
      .oc-hw-key.power { height: 26px; }
      .oc-hw-key.vol { height: 34px; }
      .oc-screen-canvas {
        display: block;
        border-radius: 12px;
        background: #09090b;
        cursor: pointer;
        user-select: none;
        touch-action: none;
      }
      .oc-bezel:not(.is-framed) .oc-screen-canvas {
        border-radius: 6px;
      }
      .oc-tile-empty {
        padding: 20px;
        text-align: center;
        max-width: 280px;
      }
    </style>
  </head>
  <body>
    <div id="root" class="oc-page-shell"></div>
    <script src="./main.js"></script>
  </body>
</html>
